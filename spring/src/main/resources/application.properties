# 服务器端口
server.port=8080

# 数据库连接配置 (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8&serverTimezone=GMT%2B8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 驼峰命名转换配置
mybatis.configuration.map-underscore-to-camel-case=true
